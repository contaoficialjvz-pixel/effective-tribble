<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JVZ CHEATS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: transparent;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Canvas do FOV */
    #fovCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Container do Painel Flutuante (Inicia Oculto) */
    .panel-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      max-width: 90vw;
      height: 220px;
      max-height: 85vh;
      background-color: rgba(20, 20, 20, 0.95);
      border: 2px solid #00ff88;
      border-radius: 8px;
      display: none; /* Começa escondido */
      flex-direction: column;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }

    /* Cabeçalho */
    .panel-header {
      background-color: #111;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      color: #00ff88;
      border-bottom: 1px solid #333;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      cursor: grab;
      touch-action: none;
    }

    .panel-header:active {
      cursor: grabbing;
    }

    /* Botão Fechar */
    .close-btn {
      color: #ff4444;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .close-btn:hover {
      color: #ff6666;
    }

    /* Conteúdo Deslizável */
    .panel-content {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .panel-content::-webkit-scrollbar {
      width: 4px;
    }
    .panel-content::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 3px;
    }

    /* Itens de Controle */
    .control-item {
      background-color: #2a2a2a;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-switch {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444;
      transition: .3s;
      border-radius: 20px;
    }

    .slider-switch:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-switch {
      background-color: #00ff88;
    }

    input:checked + .slider-switch:before {
      transform: translateX(16px);
    }

    /* Sketbar / Slider */
    .slider-box {
      flex-direction: column;
      align-items: flex-start !important;
    }

    .slider-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #00ff88;
      height: 6px;
      cursor: pointer;
      touch-action: pan-x;
    }
  </style>
</head>
<body>

  <!-- Canvas do Círculo FOV -->
  <canvas id="fovCanvas"></canvas>

  <!-- Painel Flutuante (Inicia Oculto) -->
  <div class="panel-container" id="draggablePanel">
    <div class="panel-header" id="panelHeader">
      <span>MOD APK JVZ CHEATS v1</span>
      <span class="close-btn" id="closeBtn">X</span>
    </div>

    <div class="panel-content">
      
      <div class="control-item">
        <span>Aimbot Rage</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider-switch"></span>
        </label>
      </div>

      <div class="control-item">
        <span>Aimbot Collider</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider-switch"></span>
        </label>
      </div>

      <!-- Aimfov Slider -->
      <div class="control-item slider-box">
        <span>Aimfov: <span id="fovValue">0</span></span>
        <div class="slider-row">
          <input type="range" min="0" max="120" value="0" id="fovRange">
        </div>
      </div>

      <!-- Mostrar Fov Switch -->
      <div class="control-item">
        <span>Mostrar Fov</span>
        <label class="switch">
          <input type="checkbox" id="showFovToggle">
          <span class="slider-switch"></span>
        </label>
      </div>

    </div>
  </div>

  <script>
    const panel = document.getElementById('draggablePanel');
    const header = document.getElementById('panelHeader');
    const closeBtn = document.getElementById('closeBtn');
    const fovRange = document.getElementById('fovRange');
    const fovValue = document.getElementById('fovValue');
    const showFovToggle = document.getElementById('showFovToggle');

    // Canvas do FOV
    const canvas = document.getElementById('fovCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFovCircle();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawFovCircle() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (showFovToggle.checked) {
        const radius = parseFloat(fovRange.value) * 2;
        
        if (radius > 0) {
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;

          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI, false);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#00ff88';
          ctx.stroke();
        }
      }
    }

    fovRange.addEventListener('input', function() {
      fovValue.innerText = this.value;
      drawFovCircle();
    });

    showFovToggle.addEventListener('change', drawFovCircle);

    // Fechar painel pelo X
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.style.display = 'none';
    });

    // SENSOR DE 4 DEDOS PARA ABRIR / FECHAR
    let lastGestureTime = 0;
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 4) {
        const now = Date.now();
        if (now - lastGestureTime > 500) {
          lastGestureTime = now;
          if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'flex';
          } else {
            panel.style.display = 'none';
          }
        }
      }
    }, { passive: true });

    // Isolamento do toque no Slider
    fovRange.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fovRange.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

    // Arraste do Painel pelo Título
    let isDragging = false;
    let startX, startY;
    let translateX = 0, translateY = 0;

    header.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);

    header.addEventListener('touchstart', dragStart, { passive: false });
    document.addEventListener('touchmove', drag, { passive: false });
    document.addEventListener('touchend', dragEnd);

    function dragStart(e) {
      if (e.target === closeBtn) return;
      isDragging = true;
      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      
      startX = clientX - translateX;
      startY = clientY - translateY;

      if (e.type === 'touchstart') e.preventDefault();
    }

    function drag(e) {
      if (!isDragging) return;
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

      translateX = clientX - startX;
      translateY = clientY - startY;

      panel.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px))`;

      if (e.type === 'touchmove') e.preventDefault();
    }

    function dragEnd() {
      isDragging = false;
    }
  </script>

</body>
</html>
