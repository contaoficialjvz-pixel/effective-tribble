<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JVZ CHEATS APK MOD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        @media screen and (orientation: portrait) {
            html {
                transform: rotate(90deg);
                transform-origin: left top;
                width: 100vh;
                height: 100vw;
                overflow-x: hidden;
                position: absolute;
                top: 0;
                left: 100%;
            }
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
        }

        #floating-container {
            position: absolute;
            top: 50px;
            left: 30px;
            z-index: 9999;
            touch-action: none;
            user-select: none;
            width: 75px;
            height: 75px;
        }

        #floating-icon {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            cursor: pointer;
            border: 3px solid #003366;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        #icon-close-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #ff1e38, #b3001b);
            color: #fff;
            border: 1px solid #ff6b81;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 11px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.9), inset 0 0 4px rgba(255, 255, 255, 0.5);
            transition: 0.2s;
            z-index: 10000;
        }

        #icon-close-btn:active {
            transform: scale(0.9);
        }

        #mod-menu {
            position: absolute;
            top: 40px;
            left: 80px;
            width: 340px;
            background: rgba(11, 15, 25, 0.96);
            border: 3px solid #003366;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 9998;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            touch-action: none;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #003366;
            padding-bottom: 8px;
            margin-bottom: 10px;
            cursor: grab;
        }

        .menu-header:active {
            cursor: grabbing;
        }

        .menu-title {
            font-size: 12px;
            color: #00d2ff;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        .header-btns {
            display: flex;
            gap: 5px;
        }

        .red-action-btn {
            background: linear-gradient(135deg, #ff1e38, #b3001b);
            color: #fff;
            border: 1px solid #ff6b81;
            padding: 4px 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.4);
            transition: 0.2s;
        }

        .red-action-btn:active {
            transform: scale(0.92);
        }

        .tab-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 7px 0;
            background: #131b2e;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #00d2ff;
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        .tab-content {
            display: none;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .tab-content.active {
            display: block;
        }

        .menu-btn {
            width: 100%;
            padding: 7px;
            background: #131b2e;
            border: 1px solid #00d2ff;
            color: white;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            text-align: left;
            padding-left: 10px;
            transition: 0.2s;
        }

        .menu-btn.active {
            background: #00d2ff;
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        .slider-box {
            background: #131b2e;
            border: 1px solid #00d2ff;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 10px;
        }

        .slider-box label {
            display: block;
            margin-bottom: 5px;
            color: #00d2ff;
            font-weight: 700;
        }

        .slider-box input[type=range] {
            width: 100%;
            accent-color: #00d2ff;
        }

        .info-box {
            background: #131b2e;
            border: 1px solid #00d2ff;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            line-height: 1.4;
        }

        .text-green {
            color: #2ecc71;
            font-weight: 900;
            text-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
        }

        .warning-text {
            color: #ffcc00;
            margin-top: 6px;
            border-top: 1px dashed #1a2639;
            padding-top: 5px;
        }

        #restore-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 35px;
            height: 35px;
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid #00d2ff;
            border-radius: 8px;
            color: #00d2ff;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            z-index: 99999;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="floating-container">
        <div id="icon-close-btn" onclick="hideEverything()" title="Esconder">✕</div>
        <div id="floating-icon" onclick="openMenu()">H</div>
    </div>

    <div id="restore-btn" onclick="restoreIcon()">H</div>

    <div id="mod-menu">
        <div class="menu-header" id="menu-header">
            <span class="menu-title">JVZ CHEATS APK MOD</span>
            <div class="header-btns">
                <button class="red-action-btn" onclick="hideEverything()" title="Esconder Tudo">§</button>
                <button class="red-action-btn" onclick="closeMenuToIcon()">✕</button>
            </div>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('aim', this)">AIM</button>
            <button class="tab-btn" onclick="switchTab('esp', this)">ESP</button>
            <button class="tab-btn" onclick="switchTab('info', this)">INFO</button>
        </div>

        <div id="aim" class="tab-content active">
            <button class="menu-btn" onclick="toggleBtn(this)">Ativar Aimbots: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Aimbot Rage: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Aim Silent: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Aimbot Legit: OFF</button>
            
            <div class="slider-box">
                <label>Aim-Fov: <span id="fov-val">0</span>°</label>
                <input type="range" min="0" max="360" value="0" oninput="updateFov(this.value)">
            </div>
        </div>

        <div id="esp" class="tab-content">
            <button class="menu-btn" onclick="toggleBtn(this)">Ativar Esps: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Esp Box: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Esp Line: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Esp Skeleton: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Esp Name: OFF</button>
            <button class="menu-btn" onclick="toggleBtn(this)">Esp Vida: OFF</button>
        </div>

        <div id="info" class="tab-content">
            <div class="info-box">
                📡 SERVIDOR: <span class="text-green">ONLINE</span><br>
                ✒️ CRIADOR: <span class="text-green">@jvzaovivo</span>
                <div class="warning-text">
                    ⚠️ <b>Dica:</b> Use em conta secundária para evitar blacklist.
                </div>
            </div>
        </div>
    </div>

    <script>
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        const container = document.getElementById('floating-container');
        const menu = document.getElementById('mod-menu');
        const header = document.getElementById('menu-header');
        const restoreBtn = document.getElementById('restore-btn');

        let hasMoved = false;
        let currentX = 30;
        let currentY = 50;

        function getRotatedCoordinates(e) {
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Se o navegador estiver aplicando a rotação de 90deg, inverte os eixos do toque para corresponder à tela deitada
            if (window.innerHeight > window.innerWidth) {
                return {
                    x: clientY,
                    y: window.innerWidth - clientX
                };
            }
            return { x: clientX, y: clientY };
        }

        function initDrag(targetElement, handleElement) {
            let dragging = false;
            let sX, sY;

            handleElement.addEventListener('touchstart', (e) => {
                dragging = true;
                hasMoved = false;
                let coords = getRotatedCoordinates(e);
                sX = coords.x - targetElement.offsetLeft;
                sY = coords.y - targetElement.offsetTop;
                e.stopPropagation();
            }, {passive: false});

            document.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                let coords = getRotatedCoordinates(e);
                let x = coords.x - sX;
                let y = coords.y - sY;

                if (Math.abs(x - targetElement.offsetLeft) > 2 || Math.abs(y - targetElement.offsetTop) > 2) {
                    hasMoved = true;
                }

                let maxX = window.innerWidth - targetElement.offsetWidth;
                let maxY = window.innerHeight - targetElement.offsetHeight;

                x = Math.max(0, Math.min(x, maxX));
                y = Math.max(0, Math.min(y, maxY));

                targetElement.style.left = x + 'px';
                targetElement.style.top = y + 'px';
                
                currentX = x;
                currentY = y;
                e.preventDefault();
            }, {passive: false});

            document.addEventListener('touchend', () => {
                dragging = false;
            });

            handleElement.addEventListener('mousedown', (e) => {
                dragging = true;
                hasMoved = false;
                let coords = getRotatedCoordinates(e);
                sX = coords.x - targetElement.offsetLeft;
                sY = coords.y - targetElement.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                let coords = getRotatedCoordinates(e);
                let x = coords.x - sX;
                let y = coords.y - sY;

                if (Math.abs(x - targetElement.offsetLeft) > 2 || Math.abs(y - targetElement.offsetTop) > 2) {
                    hasMoved = true;
                }

                let maxX = window.innerWidth - targetElement.offsetWidth;
                let maxY = window.innerHeight - targetElement.offsetHeight;

                x = Math.max(0, Math.min(x, maxX));
                y = Math.max(0, Math.min(y, maxY));

                targetElement.style.left = x + 'px';
                targetElement.style.top = y + 'px';
                
                currentX = x;
                currentY = y;
            });

            document.addEventListener('mouseup', () => {
                dragging = false;
            });
        }

        initDrag(container, container);
        initDrag(menu, header);

        function openMenu() {
            if (!hasMoved) {
                container.style.display = 'none';
                menu.style.left = currentX + 'px';
                menu.style.top = currentY + 'px';
                menu.style.display = 'block';
            }
        }

        function closeMenuToIcon() {
            menu.style.display = 'none';
            container.style.left = currentX + 'px';
            container.style.top = currentY + 'px';
            container.style.display = 'block';
        }

        function hideEverything() {
            menu.style.display = 'none';
            container.style.display = 'none';
            restoreBtn.style.display = 'flex';
        }

        function restoreIcon() {
            restoreBtn.style.display = 'none';
            container.style.left = currentX + 'px';
            container.style.top = currentY + 'px';
            container.style.display = 'block';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleBtn(btn) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                btn.innerText = btn.innerText.replace(': ON', ': OFF');
            } else {
                btn.classList.add('active');
                btn.innerText = btn.innerText.replace(': OFF', ': ON');
            }
        }

        function updateFov(val) {
            document.getElementById('fov-val').innerText = val;
        }
    </script>
</body>
</html>
